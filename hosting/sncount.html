<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNcount · SNHome</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #161826; color: #E9E9ED; font: 16px/1.45 system-ui, Roboto, sans-serif; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #B8B8C4; margin: 0 0 24px; }
    a { display: inline-block; background: #9184D9; color: #161826; text-decoration: none;
        font-weight: 600; padding: 12px 22px; border-radius: 22px; }
  </style>
</head>
<body>
  <main>
    <h1>SNcount</h1>
    <p>Abre este enlace desde el móvil donde tienes SNHome.</p>
    <a id="open" href="#">Abrir en SNHome</a>
  </main>
  <script>
    // Plan B por si Android no verificó el enlace y lo abrió en el navegador: el intent abre la app
    // en el mismo grupo (el intent-filter de la app acepta esta misma URL).
    document.getElementById('open').href =
      'intent://home-pantry-bed42.web.app' + location.pathname +
      '#Intent;scheme=https;package=com.homepantry.app;end';
  </script>
</body>
</html>
